name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    # EditorKrab targets Windows (PowerShell window control, CapCut paths), so the tests run there.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Python tests
        shell: pwsh
        run: |
          $failed = @()
          foreach ($t in Get-ChildItem scripts -Filter *_test.py) {
            Write-Host "== $($t.Name)"
            python $t.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $t.Name }
          }
          if ($failed) { throw "failed: $($failed -join ', ')" }
      - name: Page script tests
        shell: pwsh
        run: |
          $failed = @()
          foreach ($t in Get-ChildItem scripts -Include *_test.js, *_test.cjs -Recurse) {
            Write-Host "== $($t.Name)"
            node $t.FullName
            if ($LASTEXITCODE -ne 0) { $failed += $t.Name }
          }
          if ($failed) { throw "failed: $($failed -join ', ')" }
