name: release

# Editors' machines update to the newest vX.Y.Z tag (scripts/update.py), so pushing a tag is shipping:
#   git tag v0.29.0 && git push origin v0.29.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Release with the merged PRs as notes
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag whose release was already made by hand (or by an earlier run) is done, not a failure.
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
          fi
