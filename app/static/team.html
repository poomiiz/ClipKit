<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ทีมตัดต่อ</title><link rel="stylesheet" href="/team.css"><link rel="stylesheet" href="/shell.css"></head>
<body data-team-page="team"><main>
<h1>👥 ทีมตัดต่อ</h1><p class="muted">ฟุตและโปรเจกต์ร่วมกันขององค์กร</p>
<div id="message" role="status" aria-live="polite"></div>
<section id="auth" hidden>
<form id="login"><h2>เข้าสู่ระบบ</h2><label>อีเมล<input name="email" type="email" required autocomplete="username"></label><label>รหัสผ่าน<input name="password" type="password" required autocomplete="current-password"></label><button class="primary">เข้าสู่ระบบ</button></form>
<details><summary>สมัครบัญชีใหม่</summary><form id="signup"><label>ชื่อที่แสดง<input name="display_name" required maxlength="120" autocomplete="name"></label><label>อีเมล<input name="email" type="email" required autocomplete="username"></label><label>รหัสผ่านอย่างน้อย 8 ตัว<input name="password" type="password" required minlength="8" autocomplete="new-password"></label><button class="primary">สมัครบัญชี</button></form></details>
</section>
<section id="signedIn" hidden><div class="row"><span id="userName"></span><button id="logout">ออกจากระบบ</button></div>
<div class="panel"><label>องค์กร<select id="organization"><option value="">เลือกองค์กร</option></select></label><p class="muted" id="role"></p></div>
<form id="createOrg"><h2>สร้างองค์กรของคุณ</h2><label>ชื่อองค์กร<input name="name" required maxlength="120"></label><button>สร้างองค์กร</button><span class="muted">ผู้สร้างเป็นเจ้าขององค์กรและมีสิทธิ์ตรวจงาน</span></form>
<section id="organizationContent" hidden>
<div id="ownerControls" hidden>
<form id="addMember"><h2>เพิ่มสมาชิกที่สมัครแล้ว</h2><label>อีเมลสมาชิก<input name="email" type="email" required></label><label>สิทธิ์<select name="role"><option value="editor">✂️ คนตัด</option><option value="lead">🔎 หัวหน้าตรวจงาน</option></select></label><button>เพิ่ม / เปลี่ยนสิทธิ์สมาชิก</button></form>
<form id="driveFolder"><h2>โฟลเดอร์ Google Drive ขององค์กร</h2><label>ลิงก์โฟลเดอร์หรือ Folder ID<input name="folder" required></label><button>บันทึกโฟลเดอร์</button><span class="muted" id="driveState">ต้องเชื่อมบัญชี Drive ก่อนรับส่งไฟล์</span></form>
</div>
<div class="panel"><h2>สมาชิก</h2><div id="members"></div></div>
<div class="panel"><h2>🎞️ ฟุตขององค์กร</h2><div id="footage" class="assets"></div></div>
<div class="panel"><h2>🎬 โปรเจกต์ขององค์กร</h2><div id="projects" class="assets"></div></div>
<div class="panel"><h2>ประวัติการทำงาน</h2><div id="activity"></div></div>
</section></section>
</main><script src="/team.js"></script><script src="/shell.js"></script></body></html>
