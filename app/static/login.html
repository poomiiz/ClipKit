<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EditorKrab · เข้าสู่ระบบ</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/login.css">
  <script src="/login.js" defer></script>
</head>
<body>
  <main>
    <section class="brand" aria-labelledby="brandName">
      <img src="/logo.svg" width="176" height="176" alt="โลโก้ปู EditorKrab">
      <h1 id="brandName">EditorKrab</h1>
      <p class="slogan">ตัดคลิป จัดงาน จบในทีม</p>
    </section>
    <section class="entry" aria-labelledby="loginTitle">
      <h2 id="loginTitle">เข้าสู่ระบบก่อนเริ่มงาน</h2>
      <p class="hint">ใช้บัญชีของคุณเพื่อเข้าถึงโปรเจกต์และทีม</p>
      <button id="googleLogin" type="button" disabled><span aria-hidden="true">G</span> เข้าสู่ระบบด้วย Google</button>
      <p id="message" role="status" aria-live="polite">กำลังเชื่อมต่อระบบบัญชี…</p>
      <button id="retry" type="button" hidden>ลองเชื่อมต่อใหม่</button>
      <details>
        <summary>มีบัญชีอีเมลและรหัสผ่านอยู่แล้ว</summary>
        <form id="login">
          <label>อีเมล<input name="email" type="email" autocomplete="username" required></label>
          <label>รหัสผ่าน<input name="password" type="password" autocomplete="current-password" required></label>
          <button type="submit">เข้าสู่ระบบ</button>
        </form>
      </details>
    </section>
  </main>
</body>
</html>
